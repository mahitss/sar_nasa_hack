name: go
on:
  push:
    branches: [rebuild/submission-mvp]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...
